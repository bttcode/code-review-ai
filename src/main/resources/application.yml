spring:
  application:
    name: code-review-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/codereview
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10

# GitHub Configuration
github:
  app:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:your-webhook-secret}
    access-token: ${GITHUB_ACCESS_TOKEN:your-github-token}

# OpenAI Configuration
openai:
  api-key: ${OPENAI_API_KEY:your-openai-api-key}
  model: gpt-4
  max-tokens: 2000
  temperature: 0.3

# Application Configuration
app:
  review:
    enabled: true
    auto-comment: true
    min-confidence-score: 0.7

logging:
  level:
    com.portfolio.codereview: DEBUG
    org.hibernate.SQL: DEBUG